# Setting default shell
set-option -g default-command /bin/zsh

unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g prefix C-s

# Open new window in the current directory path
bind c new-window -c "#{pane_current_path}"

# Reorganize index automatically
set -g renumber-windows on

# split panes using = and -
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch panes like vim
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# turn mouse support on
set-option -g mouse on

# start with window and pane number 1
set-option -g base-index 1
set-option -g pane-base-index 1

# allow manual renaming windows
set-window-option -g allow-rename off

# redimensiona painel with Vim keys (no prefix)
bind-key -n C-S-Left resize-pane -L 1
bind-key -r H resize-pane -L 1

bind-key -n C-S-Right resize-pane -R 1
bind-key -r L resize-pane -R 1

bind-key -n C-S-Down resize-pane -D 1
bind-key -r J resize-pane -D 1

bind-key -n C-S-Up resize-pane -U 1
bind-key -r K resize-pane -U 1

set -g status-position bottom 

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'moon' # Options are 'main', 'moon' or 'dawn'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore automatically tmux panes and sessions on boot
set -g @continuum-restore 'on'

set -g @rose_pine_host 'on'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_directory 'on'
set -g @rose_pine_bar_bg_disable 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
